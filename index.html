<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ライフハック雑学 リサーチ</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --text:#1b1f24; --muted:#6b7280;
    --accent:#d92d20; --accent-soft:#fdeceb; --good:#0f7b47; --good-soft:#e7f5ee;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;
    display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:700}
  .meta{color:var(--muted);font-size:12px}
  button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;
    padding:7px 13px;cursor:pointer}
  button:hover{background:#f0f2f5}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{opacity:.9}
  nav{display:flex;gap:6px;padding:12px 20px 0;flex-wrap:wrap}
  nav a{padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-size:14px;
    border:1px solid transparent;color:var(--muted)}
  nav a.on{background:#fff;border-color:var(--line);border-bottom-color:#fff;color:var(--text);font-weight:600}
  main{padding:0 20px 60px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:18px}
  .lead{color:var(--muted);font-size:13px;margin:0 0 14px;line-height:1.7}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:#fff}
  td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  tr:hover td{background:#fafbfc}
  a{color:inherit;text-decoration:none}
  a.t:hover{text-decoration:underline}
  .badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;
    background:#eef1f4;color:var(--muted);margin-left:6px;white-space:nowrap}
  .badge.hot{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .badge.new{background:var(--good-soft);color:var(--good);font-weight:700}
  .card{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .card img{width:150px;height:84px;object-fit:cover;border-radius:6px;background:#eee;flex:none}
  .card .body{flex:1;min-width:0}
  .card .ttl{font-weight:600;font-size:14.5px;line-height:1.5;margin-bottom:5px}
  .card .sub{color:var(--muted);font-size:12.5px;line-height:1.8}
  .kw{display:inline-block;background:#fff5f4;color:var(--accent);border:1px solid #f7d5d2;
    border-radius:6px;padding:1px 8px;font-size:12px;margin:3px 5px 0 0}
  .rank{font-size:20px;font-weight:800;color:#c9ced4;width:34px;flex:none;text-align:right}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .stat{border:1px solid var(--line);border-radius:8px;padding:12px}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:22px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
  .bar{height:6px;background:#eef1f4;border-radius:3px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .muteBtn{font-size:11px;padding:2px 8px;color:var(--muted)}
  .empty{color:var(--muted);padding:40px 0;text-align:center}
  .chips{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:13px;
    cursor:pointer;background:#fff;color:var(--muted)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .act{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .act button{font-size:11.5px;padding:3px 9px;border-radius:6px}
  .act button.main{border-color:#c9ced4;font-weight:600}
  #overlay{position:fixed;inset:0;background:rgba(15,18,22,.45);z-index:50;display:none;
    align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
  #overlay.show{display:flex}
  #modal{background:#fff;border-radius:12px;max-width:860px;width:100%;padding:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.3)}
  #modal h2{font-size:16px;margin:0 0 4px;line-height:1.5}
  #modal .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
  #modal h3{font-size:13.5px;margin:18px 0 8px}
  .spark{width:100%;height:120px;background:#fafbfc;border:1px solid var(--line);border-radius:8px}
  .tag{display:inline-block;background:#eef1f4;border-radius:6px;padding:2px 9px;
    font-size:12px;margin:0 5px 5px 0}
  #modal textarea{width:100%;height:180px;font:12.5px/1.7 inherit;border:1px solid var(--line);
    border-radius:8px;padding:10px;resize:vertical;color:var(--text)}
  #toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:99;
    background:#1b1f24;color:#fff;padding:10px 20px;border-radius:8px;font-size:13.5px;
    opacity:0;transition:opacity .25s;pointer-events:none}
  #toast.show{opacity:1}
  .navBadge{display:inline-block;background:var(--accent);color:#fff;font-size:11px;
    font-weight:700;border-radius:999px;padding:1px 7px;vertical-align:2px}
  .favBtn{font-size:16px;padding:2px 8px;border:none;background:none;cursor:pointer;
    color:#c9ced4}
  .favBtn.on{color:#f5a623}
  .memoCard{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  .memoCard input{width:100%;font:600 15px/1.5 inherit;border:none;outline:none;
    color:var(--text);margin-bottom:8px;background:transparent}
  .memoCard textarea{width:100%;min-height:120px;font:13px/1.8 inherit;border:1px solid var(--line);
    border-radius:8px;padding:10px;resize:vertical;color:var(--text)}
  .memoCard .foot{display:flex;gap:6px;margin-top:8px;align-items:center}
  .memoCard .foot .when{color:var(--muted);font-size:11.5px;margin-left:auto}
</style>
</head>
<body>
<header>
  <h1>ライフハック雑学 リサーチ</h1>
  <span class="meta" id="meta">読み込み中…</span>
  <span style="flex:1"></span>
  <button id="btnQuick">検索だけ更新</button>
  <button class="primary" id="btnRun">今すぐ収集</button>
  <button onclick="location.reload()">再読込</button>
</header>
<nav id="nav"></nav>
<main><div class="panel" id="panel"><div class="empty">読み込み中…</div></div></main>

<div id="overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal"></div>
</div>
<div id="toast"></div>

<script>
const TABS = [
  ["opp",   "作るべきネタ"],
  ["hot",   "伸びている動画"],
  ["srch",  "YouTube検索"],
  ["web",   "SNS・記事"],
  ["new",   "新着"],
  ["memo",  "台本メモ"],
  ["vid",   "動画作成"],
  ["pat",   "タイトルの型"],
  ["topic", "キーワード"],
  ["ch",    "チャンネル"],
  ["self",  "自分の成績"],
];
let DATA = null, MEMOS = null, newCount = 0;
let tab = localStorage.getItem("ytr_tab") || "opp";

const v = n => n==null ? "-" : (n>=10000 ? (n/10000).toFixed(1)+"万" : Math.round(n).toLocaleString());
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const days = d => d==null ? "-" : (d < 1 ? Math.round(d*24)+"時間" : d.toFixed(d<10?1:0)+"日");

function renderNav(){
  document.getElementById("nav").innerHTML = TABS.map(([k,l]) => {
    const badge = (k==="new" && newCount>0) ? ` <span class="navBadge">${newCount}</span>` : "";
    return `<a class="${k===tab?'on':''}" onclick="go('${k}')">${l}${badge}</a>`;
  }).join("");
}
function go(k){
  tab=k; localStorage.setItem("ytr_tab",k);
  if(k==="new") localStorage.setItem("ytr_new_seen", new Date().toISOString());
  renderNav(); render();
}

function mult(m){
  if(m==null || m<0.05) return "";
  const cls = m>=2 ? "badge hot" : (m>=1.3 ? "badge new" : "badge");
  return `<span class="${cls}">平均比 ${m}x</span>`;
}

function render(){
  const p = document.getElementById("panel");
  if(!DATA){ p.innerHTML='<div class="empty">読み込み中…</div>'; return; }
  p.innerHTML = ({opp:vOpp, hot:vHot, srch:vSrch, web:vWeb, new:vNew, memo:vMemo,
                  vid:vVid, pat:vPat, topic:vTopic, ch:vCh, self:vSelf})[tab]();
  if(tab==="memo") loadMemos();
  if(tab==="vid") vidInit();
  if(tab==="srch") renderSearchResults();
  if(tab==="web") renderWebResults();
}

const VMAP = {};
function actions(r){
  VMAP[r.video_id] = {title: r.title, url: r.url};
  return `<div class="act">
    <button class="main" onclick="openDetail('${r.video_id}')">分析</button>
    <button onclick="copyTitle('${r.video_id}')">タイトル</button>
    <button onclick="copyThumb('${r.video_id}')">サムネ</button>
    <button onclick="copyTranscript('${r.video_id}')">台本</button>
    <button onclick="copyPack('${r.video_id}')">パック</button>
    <button onclick="openAI('${r.video_id}','claude')">Claude</button>
    <button onclick="openAI('${r.video_id}','gpt')">GPT</button>
  </div>`;
}

function vOpp(){
  const rows = DATA.opportunities || [];
  if(!rows.length) return lead("競合が当てていて、自分のタイトルにまだ出てこないネタを並べます。")
    + '<div class="empty">まだデータが足りません。「今すぐ収集」を押してください。</div>';
  return lead("競合が当てていて、<b>自分のタイトルにまだ出ていない言葉</b>を含む動画。上から順に企画候補です。赤いタグが未使用キーワード。")
   + rows.map((r,i)=>`
    <div class="card">
      <div class="rank">${i+1}</div>
      <img loading="lazy" src="${r.thumb}" alt="">
      <div class="body">
        <div class="ttl"><a class="t" href="${r.url}" target="_blank">${esc(r.title)}</a>${mult(r.multiple)}</div>
        <div class="sub">${esc(r.channel_title)}${r.channel_subs?`（登録 ${v(r.channel_subs)}）`:""}
          ・${v(r.views)}回・${days(r.age_days)}前・時速 ${v(r.recent_vph ?? r.vph)}回</div>
        <div>${(r.fresh_words||[]).map(w=>`<span class="kw">${esc(w)}</span>`).join("")}</div>
        ${actions(r)}
      </div>
    </div>`).join("");
}

const HOT_PERIODS = [["1","24時間"],["3","3日"],["7","7日"],["30","30日"],["90","90日"]];
let hotPeriod = localStorage.getItem("ytr_hot_period") || "7";

function setHotPeriod(p){ hotPeriod=p; localStorage.setItem("ytr_hot_period",p); render(); }

function vHot(){
  const lim = parseFloat(hotPeriod);
  const all = DATA.hot || [];
  const rows = all.filter(r => r.age_days != null && r.age_days <= lim).slice(0, 60);
  const chips = `<div class="chips">${HOT_PERIODS.map(([p,l]) =>
    `<span class="chip ${p===hotPeriod?'on':''}" onclick="setHotPeriod('${p}')">${l}</span>`).join("")}</div>`;
  return lead("指定期間に投稿された競合動画を「勢い(時速の実測)×そのチャンネルの平均に対する倍率」で並べたもの。登録者が少ないのに倍率が高いものほど、ネタ自体の力が強いと読めます。")
   + chips
   + (rows.length ? table(["#","","タイトル / 操作","チャンネル","再生","経過","倍率","時速"],
      rows.map((r,i)=>[
        `<td class="num">${i+1}</td>`,
        `<td><img loading="lazy" src="${r.thumb}" style="width:104px;height:58px;object-fit:cover;border-radius:4px"></td>`,
        `<td><a class="t" href="${r.url}" target="_blank">${esc(r.title)}</a>${actions(r)}</td>`,
        `<td style="color:var(--muted)">${esc(r.channel_title)}</td>`,
        `<td class="num">${v(r.views)}</td>`,
        `<td class="num">${days(r.age_days)}</td>`,
        `<td class="num">${r.multiple ?? "-"}</td>`,
        `<td class="num">${v(r.recent_vph ?? r.vph)}</td>`,
      ].join("")))
     : `<div class="empty">この期間に投稿された動画はまだ記録にありません。「今すぐ収集」で最新を取り込んでください。</div>`);
}

/* ---------------- YouTube検索タブ ---------------- */
let SRCH = {q: localStorage.getItem("ytr_srch_q") || "", period: localStorage.getItem("ytr_srch_p") || "month",
            results: null, loading: false};

const SRCH_PERIODS = [["today","今日"],["week","今週"],["month","今月"],["year","今年"],
                      ["all","全期間"],["views","再生数順"],["recent","新着順"]];

function vSrch(){
  return lead("YouTubeを直接キーワード検索。結果の動画はそのまま分析・台本取得・AI台本化ができ、DBにも記録されます。")
   + `<div class="act" style="margin-bottom:16px;gap:8px">
        <input id="srchQ" value="${esc(SRCH.q)}" placeholder="例: エアコン 電気代 裏技"
          style="flex:1;min-width:220px;font:14px/1.5 inherit;border:1px solid var(--line);border-radius:8px;padding:8px 12px"
          onkeydown="if(event.key==='Enter')doSearch()">
        <select id="srchP" style="font:13.5px inherit;border:1px solid var(--line);border-radius:8px;padding:8px">
          ${SRCH_PERIODS.map(([k,l])=>`<option value="${k}" ${k===SRCH.period?'selected':''}>${l}</option>`).join("")}
        </select>
        <label style="font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:4px">
          <input type="checkbox" id="srchNoShorts" checked onchange="renderSearchResults()">ショート除外</label>
        <button class="main" onclick="doSearch()">検索</button>
      </div>
      <div id="srchResults"></div>`;
}

function renderSearchResults(){
  const box = document.getElementById("srchResults");
  if(!box) return;
  if(SRCH.loading){ box.innerHTML = '<div class="empty">検索中…</div>'; return; }
  if(SRCH.results === null){ box.innerHTML = '<div class="empty">キーワードを入れて検索してください</div>'; return; }
  let rows = SRCH.results;
  if(document.getElementById("srchNoShorts")?.checked)
    rows = rows.filter(r => !r.duration_sec || r.duration_sec >= 75);
  if(!rows.length){ box.innerHTML = '<div class="empty">結果がありませんでした</div>'; return; }
  box.innerHTML = rows.map((r,i)=>`
    <div class="card">
      <div class="rank">${i+1}</div>
      <img loading="lazy" src="${r.thumb}" alt="">
      <div class="body">
        <div class="ttl">
          ${r.is_self?'<span class="badge hot">自分</span> ':''}${r.is_rival?'<span class="badge">追跡中</span> ':''}
          <a class="t" href="${r.url}" target="_blank">${esc(r.title)}</a></div>
        <div class="sub">${esc(r.channel_title)}・${v(r.views)}回${r.age_days!=null?`・${days(r.age_days)}前`:""}${r.duration_sec?`・${Math.floor(r.duration_sec/60)}分${r.duration_sec%60}秒`:""}</div>
        ${actions(r)}
      </div>
    </div>`).join("");
}

async function doSearch(){
  const q = document.getElementById("srchQ").value.trim();
  const period = document.getElementById("srchP").value;
  if(!q){ toast("キーワードを入れてください"); return; }
  SRCH.q = q; SRCH.period = period; SRCH.loading = true;
  localStorage.setItem("ytr_srch_q", q); localStorage.setItem("ytr_srch_p", period);
  renderSearchResults();
  try{
    const d = await (await fetch(`/api/search?q=${encodeURIComponent(q)}&period=${period}`)).json();
    SRCH.results = d.results || [];
    toast(`${SRCH.results.length}件見つかりました`);
  }catch(e){
    SRCH.results = [];
    toast("検索に失敗しました: "+e);
  }
  SRCH.loading = false;
  renderSearchResults();
}

/* ---------------- SNS・記事検索タブ ---------------- */
let WEB = {q: localStorage.getItem("ytr_web_q") || "", results: null, loading: false,
           sources: JSON.parse(localStorage.getItem("ytr_web_src") || "null") ||
                    ["x","ynews","gnews","hatena","note","blog","tiktok","instagram","threads"]};

const WEB_SOURCES = [
  ["x","X(Twitter)"], ["ynews","Yahoo!ニュース"], ["gnews","ニュース記事"], ["hatena","はてブ"],
  ["note","note"], ["blog","ブログ・記事"], ["tiktok","TikTok"], ["instagram","Instagram"], ["threads","Threads"],
];
const WEB_PRESETS = ["ライフハック", "生活の知恵 裏技", "掃除 裏技", "節約 術", "雑学 面白い",
                     "暑さ対策", "虫除け 対策", "100均 便利"];

function vWeb(){
  return lead("X・ニュース・はてブ・ブログ・TikTok・Instagram・Threads を横断検索して、YouTube以外で話題のライフハックネタを拾います。")
   + `<div class="act" style="margin-bottom:8px;gap:8px">
        <input id="webQ" value="${esc(WEB.q)}" placeholder="例: 生活の知恵 裏技"
          style="flex:1;min-width:220px;font:14px/1.5 inherit;border:1px solid var(--line);border-radius:8px;padding:8px 12px"
          onkeydown="if(event.key==='Enter')doWebSearch()">
        <button class="main" onclick="doWebSearch()">横断検索</button>
      </div>
      <div style="margin-bottom:8px">${WEB_PRESETS.map(p=>
        `<span class="kw" style="cursor:pointer" onclick="document.getElementById('webQ').value='${p}';doWebSearch()">${p}</span>`).join("")}</div>
      <div style="margin-bottom:14px">${WEB_SOURCES.map(([k,l])=>
        `<label style="font-size:12.5px;color:var(--muted);margin-right:12px;white-space:nowrap">
          <input type="checkbox" ${WEB.sources.includes(k)?'checked':''} onchange="toggleWebSrc('${k}',this.checked)"> ${l}</label>`).join("")}</div>
      <div class="act" style="margin-bottom:14px">
        <button onclick="copyWebResults()">結果を全部コピー</button>
        <button onclick="webAI('claude')">Claudeでネタ出し</button>
        <button onclick="webAI('gpt')">GPTでネタ出し</button>
      </div>
      <div id="webResults"></div>`;
}

function toggleWebSrc(k, on){
  WEB.sources = on ? [...new Set([...WEB.sources, k])] : WEB.sources.filter(s=>s!==k);
  localStorage.setItem("ytr_web_src", JSON.stringify(WEB.sources));
}

function renderWebResults(){
  const box = document.getElementById("webResults");
  if(!box) return;
  if(WEB.loading){ box.innerHTML = '<div class="empty">横断検索中… 5〜10秒かかります</div>'; return; }
  if(WEB.results === null){ box.innerHTML = '<div class="empty">キーワードを入れて検索してください</div>'; return; }
  const keys = Object.keys(WEB.results);
  if(!keys.length){ box.innerHTML = '<div class="empty">結果がありませんでした</div>'; return; }
  box.innerHTML = keys.map(k=>{
    const d = WEB.results[k];
    const items = d.items || [];
    return `<h3 style="font-size:14px;margin:20px 0 8px">${esc(d.label)}
        <span class="badge">${items.length}件</span>${d.error?` <span class="badge hot">取得失敗</span>`:""}</h3>`
      + (items.length ? items.map(it=>`
        <div style="padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px">
          ${it.thumb?`<img loading="lazy" src="/api/webthumb?u=${encodeURIComponent(it.thumb)}" style="width:86px;height:60px;object-fit:cover;border-radius:6px;flex:none" onerror="this.style.display='none'">`:""}
          <div style="flex:1;min-width:0">
            <div style="font-size:13.5px;line-height:1.6"><a class="t" href="${it.url}" target="_blank">${esc(it.title)}</a></div>
            <div class="sub" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
              <span>${esc(it.author||"")}${it.date?`・${new Date(it.date).toLocaleDateString("ja-JP")}`:""}</span>
              ${it.snippet?`<span style="color:var(--muted)">${esc(it.snippet)}</span>`:""}
              <button class="muteBtn" onclick='webCopy(${JSON.stringify(it.title)},${JSON.stringify(it.url)})'>コピー</button>
              <button class="muteBtn" onclick='webMemo(${JSON.stringify(it.title)},${JSON.stringify(it.url)})'>メモ</button>
            </div>
          </div>
        </div>`).join("") : '<div class="sub">なし</div>');
  }).join("");
}

async function doWebSearch(){
  const q = document.getElementById("webQ").value.trim();
  if(!q){ toast("キーワードを入れてください"); return; }
  if(!WEB.sources.length){ toast("ソースを1つ以上選んでください"); return; }
  WEB.q = q; WEB.loading = true;
  localStorage.setItem("ytr_web_q", q);
  renderWebResults();
  try{
    const d = await (await fetch(`/api/websearch?q=${encodeURIComponent(q)}&sources=${WEB.sources.join(",")}`)).json();
    WEB.results = d.results || {};
    const n = Object.values(WEB.results).reduce((a,s)=>a+(s.items||[]).length,0);
    toast(`${n}件見つかりました`);
  }catch(e){ WEB.results = {}; toast("検索に失敗しました: "+e); }
  WEB.loading = false;
  renderWebResults();
}

function webResultsText(){
  const L = [`「${WEB.q}」のSNS・ニュース・記事の横断検索結果`];
  for(const k of Object.keys(WEB.results||{})){
    const d = WEB.results[k];
    if(!(d.items||[]).length) continue;
    L.push("", "■ "+d.label);
    d.items.forEach(it=>L.push(`・${it.title}${it.author?` (${it.author})`:""} ${it.url}`));
  }
  return L.join("\n");
}

async function copyWebResults(){
  if(!WEB.results){ toast("先に検索してください"); return; }
  const text = webResultsText();

async function vidPlan(){
  const name = document.getElementById("vidName").value.trim();
  const script = document.getElementById("vidScript").value;
  if(!name || !script.trim()) return toast("名前と台本を入れてください");
  VID.name = name; localStorage.setItem("ytr_vid_name", name);
  const body = {name, script, topic: document.getElementById("vidTopic").value.trim()};
  const r = await fetch("/api/video/plan", {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  VID.plan = await r.json();
  vidRenderPlan();
  toast(`${VID.plan.stats.clips}クリップに分けました`);
}

function vidRenderPlan(){
  const st = VID.plan.stats;
  document.getElementById("vidStats").innerHTML = `<div class="card" style="display:block">
    <b>${st.clips}クリップ</b> ／ 1行 ${st.one_line}・2行 ${st.two_line}
    ${st.over_line.length?`<span class="badge hot">3行 ${st.over_line.length}</span>`:""}
    ${st.too_wide.length?`<span class="badge hot">幅超え ${st.too_wide.length}</span>`:""}
    ／ ${st.chars_with_newline}字（改行込み）
    ／ 読みを直した ${st.fixes}件
    ${st.warns?`<span class="badge hot">要確認 ${st.warns}件</span>`:'<span class="badge">誤読なし</span>'}
    ${VID.plan.scanned?"":' <span class="sub">※pyopenjtalk が無いので簡易チェックです</span>'}
  </div>`;
  document.getElementById("vidClips").innerHTML = VID.plan.clips.map(vidClipHtml).join("");
}

function vidClipHtml(c){
  const warn = (c.warns||[]).map(w=>`<div class="sub" style="color:#b00">⚠️ ${esc(w.note)}</div>`).join("");
  const fix  = (c.fixes||[]).map(f=>`<div class="sub">読みを直しました: ${esc(f.before)} → ${esc(f.after)}</div>`).join("");
  const img  = c.image ? `<img src="/api/video/file?p=${encodeURIComponent(vidRel(c.image))}&t=${Date.now()}"
                             style="width:120px;height:68px;object-fit:cover;border-radius:4px">`
                       : `<div style="width:120px;height:68px;background:#eee;border-radius:4px"></div>`;
  return `<div class="card" id="vidc${c.index}">
    <div class="rank">${c.index+1}</div>
    <div style="margin-right:8px">${img}</div>
    <div class="body">
      <textarea rows="2" style="width:100%" onchange="vidSet(${c.index},'caption',this.value)"
        >${esc(c.caption)}</textarea>
      <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap">
        <input value="${esc(c.speech)}" style="flex:2;min-width:220px"
          onchange="vidSet(${c.index},'speech',this.value)" title="読み上げる文（字幕とは別）">
        <input value="${esc(c.keyword||"")}" style="width:130px"
          onchange="vidSet(${c.index},'keyword',this.value)" title="画像を探すことば">
        <button onclick="vidPickImage(${c.index})">画像を選ぶ</button>
        <span class="sub">${c.duration?c.duration.toFixed(1)+"秒":"音声まだ"}</span>
      </div>
      ${fix}${warn}
    </div></div>`;
}

// ---- 実行
async function vidJob(what){
  if(!VID.plan) return toast("先に台本を読み込んでください");
  const sel = document.getElementById("vidSpeaker");
  const config = sel ? {voicevox_speaker: +sel.value} : {};
  if((localStorage.getItem("ytr_vid_imgmode") || "folder") === "folder"){
    config.image_folder = vidFolder();
    config.assign_mode = localStorage.getItem("ytr_vid_assign") || "order";
  }
  const r = await fetch("/api/video/"+what, {method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name: VID.name, config, bgm: VID.bgm.filter(b=>b.file)})});
  const d = await r.json();
  if(d.error) return toast(d.error);
  vidPoll();
}

async function vidPoll(){
  if(VID.timer) clearTimeout(VID.timer);
  const el = document.getElementById("vidProg"); if(!el) return;
  const s = await (await fetch("/api/video/progress")).json();
  if(s.running){
    el.innerHTML = `<div class="card" style="display:block">⏳ ${esc(s.message||s.step)}</div>`;
    VID.timer = setTimeout(vidPoll, 1500);
    return;
  }
  if(s.error){
    el.innerHTML = `<div class="card" style="display:block;color:#b00">失敗しました: ${esc(s.error)}</div>`;
  }else if(s.output){
    const rel = vidRel(s.output);
    el.innerHTML = `<div class="card" style="display:block">✅ できました（${Math.round(s.total_sec/60)}分${Math.round(s.total_sec%60)}秒）
      <div style="margin-top:8px"><video src="/api/video/file?p=${encodeURIComponent(rel)}"
        controls style="max-width:560px;width:100%"></video></div>
      <div class="sub">${esc(s.output)}</div></div>`;
  }else{
    el.innerHTML = "";
  }
  if(VID.name){
    const plan = await (await fetch("/api/video/plan?name="+encodeURIComponent(VID.name))).json();
    if(plan && plan.clips){ VID.plan = plan; vidRenderPlan(); }
  }
}

let toastTimer = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

async function writeClip(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  }
}

function showCopyFallback(text, label){
  // クリップボードが使えない環境用: 選択済みで表示して Cmd+C してもらう
  const ov = document.getElementById("overlay"), md = document.getElementById("modal");
  ov.classList.add("show");
  md.innerHTML = `<h2>${esc(label||"コピー")}</h2>
    <div class="sub">自動コピーが使えない環境です。下のテキストは選択済みなので、そのまま <b>Cmd+C</b> を押してください。</div>
    <textarea id="fbText" readonly style="height:260px"></textarea>
    <div style="text-align:right;margin-top:12px"><button onclick="closeModal()">閉じる</button></div>`;
  const ta = document.getElementById("fbText");
  ta.value = text;
  ta.focus(); ta.select();
}

    const blob = await res.blob();

    const cv = document.createElement("canvas");
    cv.width = bmp.width; cv.height = bmp.height;
    cv.getContext("2d").drawImage(bmp, 0, 0);
    const png = await new Promise(r => cv.toBlob(r, "image/png"));
    await navigator.clipboard.write([new ClipboardItem({"image/png": png})]);
    toast("サムネ画像をコピーしました（そのまま貼り付けできます）");
  }catch(e){
    await writeClip(`https://i.ytimg.com/vi/${vid}/maxresdefault.jpg`);

function sparkline(snaps){
  const pts = (snaps||[]).filter(s=>s.views!=null);
  if(pts.length < 2) return '<div class="sub">まだ計測点が足りません（収集のたびに増えます）</div>';
  const W=780, H=110, P=8;
  const t0 = new Date(pts[0].ts).getTime(), t1 = new Date(pts[pts.length-1].ts).getTime();
  const v0 = Math.min(...pts.map(p=>p.views)), v1 = Math.max(...pts.map(p=>p.views));
  const X = t => P + (W-2*P) * (t1===t0 ? 0.5 : (t-t0)/(t1-t0));
  const Y = vv => H-P - (H-2*P) * (v1===v0 ? 0.5 : (vv-v0)/(v1-v0));
  const path = pts.map((p,i)=>`${i?"L":"M"}${X(new Date(p.ts).getTime()).toFixed(1)},${Y(p.views).toFixed(1)}`).join(" ");
  const dots = pts.map(p=>`<circle cx="${X(new Date(p.ts).getTime()).toFixed(1)}" cy="${Y(p.views).toFixed(1)}" r="3" fill="var(--accent)"/>`).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}</svg>
    <div class="sub">${new Date(pts[0].ts).toLocaleString("ja-JP")} ${v(v0)}回 → ${new Date(pts[pts.length-1].ts).toLocaleString("ja-JP")} ${v(v1)}回（+${v(v1-v0)}）</div>`;
}

    document.getElementById("panel").innerHTML = `
      <div class="empty" style="line-height:2">
        <div style="font-size:15px;color:var(--text);font-weight:600">このページはファイルとして開かれています</div>
        データはローカルサーバーから読み込むため、この開き方では表示できません。<br>
        <a class="t" href="http://localhost:8770" style="color:var(--accent);font-weight:600;font-size:15px">
          → http://localhost:8770 を開く</a><br>
        <span style="font-size:12px">（フォルダ内の「リサーチを開く.command」をダブルクリックしても同じです）</span>
      </div>`;
    return;
  }
  const r = await fetch("/api/data");
  DATA = await r.json();
  const seenTs = localStorage.getItem("ytr_new_seen") || "";
  (DATA.new_videos||[]).forEach(v => v._isNew = (v.first_seen||"") > seenTs);
  newCount = (DATA.new_videos||[]).filter(v=>v._isNew).length;
  const t = new Date(DATA.generated_at);
  document.getElementById("meta").textContent =
    `動画 ${DATA.video_count}本 / チャンネル ${(DATA.channels||[]).length} / 更新 ${t.toLocaleString("ja-JP")}`;
  renderNav(); render();
}
async function kick(quick){
  const meta = document.getElementById("meta");
  meta.textContent = "収集中…";
  await fetch("/api/run"+(quick?"?quick=1":""));
  const iv = setInterval(async ()=>{
    const s = await (await fetch("/api/state")).json();
    if(s.running){
      meta.textContent = "収集中… " + (s.log || "");
    }else{
      clearInterval(iv);
      meta.textContent = "集計中…";
      load();
      toast("収集が完了しました");
    }
  }, 3000);
}
document.getElementById("btnRun").onclick = ()=>kick(false);
document.getElementById("btnQuick").onclick = ()=>kick(true);
renderNav(); load();
</script>
