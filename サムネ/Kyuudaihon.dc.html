<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #ffd400; } a:hover { color: #ffe866; }
    .jp { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    .out { -webkit-text-stroke: 14px #0d0d0d; paint-order: stroke fill; }
    .out-s { -webkit-text-stroke: 9px #0d0d0d; paint-order: stroke fill; }
  </style>
</helmet>

<div class="jp" style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #181511;">

  <!-- 背景プレースホルダー -->
  <div style="position: absolute; inset: 0;
      background: radial-gradient(115% 88% at 24% 12%, #6f6350 0%, #3c3429 46%, #181511 80%);"></div>
  <div style="position: absolute; left: -50px; top: -70px; width: 640px; height: 920px;
      background: linear-gradient(158deg, rgba(255,238,200,0.32) 0%, rgba(255,238,200,0.06) 46%, rgba(255,238,200,0) 70%);
      transform: rotate(-14deg); filter: blur(2px);"></div>
  <div style="position: absolute; left: 110px; bottom: -40px; width: 580px; height: 320px; border-radius: 44px 44px 0 0;
      background: linear-gradient(180deg, #eae4d7 0%, #bbb3a2 100%); opacity: 0.55;"></div>

  <div style="position: absolute; left: 32px; top: 28px; max-width: 450px; padding: 13px 15px;
      border: 2px dashed rgba(255,255,255,0.42); border-radius: 10px;
      font-size: 14px; line-height: 1.55; color: rgba(255,255,255,0.85);">
    <b style="color:#ffd400">背景をここに差し替え</b><br>
    朝の寝室。60代女性がくしゃみをこらえる。白い布団と、光の中に舞う細かいホコリ。
    <b>右3分の1は空ける。</b>
  </div>

  <!-- 年齢バッジ（旧台本は年齢明示型） -->
  <div style="position: absolute; left: 44px; top: 470px; padding: 10px 22px; background: #e8342a; border-radius: 8px;
      transform: rotate(-3deg); box-shadow: 0 6px 0 rgba(0,0,0,0.45);">
    <span style="font-weight: 900; font-size: 46px; color: #ffffff; letter-spacing: 0.04em;">60代の秋の不調</span>
  </div>

  <!-- 文字レイヤー -->
  <div style="position: absolute; right: 44px; top: 40px; height: 640px;
      display: flex; flex-direction: row-reverse; align-items: flex-start; gap: 10px;">
    <div class="out" style="writing-mode: vertical-rl; font-weight: 900; font-size: 84px; line-height: 1.04;
        letter-spacing: 0.02em; color: #ffffff;">9月の布団は</div>
    <div class="out" style="writing-mode: vertical-rl; font-weight: 900; font-size: 84px; line-height: 1.04;
        letter-spacing: 0.02em; color: #ffd400; margin-top: 26px;">夏より汚い</div>
  </div>

  <div style="position: absolute; right: 12px; bottom: 12px; width: 210px; height: 54px;
      border: 1px dashed rgba(255,255,255,0.18); border-radius: 6px;"></div>

</div>
</x-dc>
</body>
</html>
