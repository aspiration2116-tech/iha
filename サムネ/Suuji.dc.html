<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #ffd400; } a:hover { color: #ffe866; }
    .jp { font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    .out { -webkit-text-stroke: 12px #0d0d0d; paint-order: stroke fill; }
    .out-s { -webkit-text-stroke: 7px #0d0d0d; paint-order: stroke fill; }
  </style>
</helmet>

<div class="jp" style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #171410;">

  <!-- 背景プレースホルダー：布団に掃除機 -->
  <div style="position: absolute; inset: 0;
      background: radial-gradient(110% 85% at 70% 20%, #7a6e58 0%, #40382d 48%, #171410 82%);"></div>
  <div style="position: absolute; right: 40px; top: 90px; width: 620px; height: 420px; border-radius: 28px;
      background: linear-gradient(170deg, #efe9dc 0%, #c4bcab 100%); opacity: 0.62; transform: rotate(-4deg);"></div>
  <div style="position: absolute; right: -30px; top: -50px; width: 560px; height: 880px;
      background: linear-gradient(168deg, rgba(255,240,205,0.30) 0%, rgba(255,240,205,0.05) 46%, rgba(255,240,205,0) 70%);
      transform: rotate(14deg); filter: blur(2px);"></div>

  <div style="position: absolute; right: 30px; bottom: 86px; max-width: 430px; padding: 13px 15px;
      border: 2px dashed rgba(255,255,255,0.42); border-radius: 10px;
      font-size: 14px; line-height: 1.55; color: rgba(255,255,255,0.85);">
    <b style="color:#ffd400">背景をここに差し替え</b><br>
    白い布団の上を、掃除機のヘッドがゆっくり進む。手だけが写り、顔は入れない。
    明るい午後の光。<b>左半分は空ける。</b>
  </div>

  <!-- 文字レイヤー：数字を主役に -->
  <div style="position: absolute; left: 56px; top: 96px; display: flex; align-items: baseline; gap: 16px;">
    <div class="out" style="font-weight: 900; font-size: 250px; line-height: 0.86; color: #ffd400;">4</div>
    <div class="out" style="font-weight: 900; font-size: 118px; line-height: 1; color: #ffffff;">分</div>
  </div>

  <div class="out-s" style="position: absolute; left: 60px; top: 336px; font-weight: 900; font-size: 58px;
      line-height: 1.26; color: #ffffff; letter-spacing: 0.01em;">
    布団のダニ汚れが<br><span style="color:#ffd400">ごっそり出る</span>
  </div>

  <div style="position: absolute; left: 60px; bottom: 46px; display: flex; align-items: center; gap: 12px;">
    <div class="out-s" style="font-weight: 900; font-size: 52px; color: #ffffff; letter-spacing: 0.02em;">ただし</div>
    <div class="out-s" style="font-weight: 900; font-size: 52px; color: #ffd400; letter-spacing: 0.02em;">順番がある</div>
  </div>

  <div style="position: absolute; right: 12px; bottom: 12px; width: 210px; height: 54px;
      border: 1px dashed rgba(255,255,255,0.18); border-radius: 6px;"></div>

</div>
</x-dc>
</body>
</html>
