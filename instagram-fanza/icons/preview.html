<!doctype html>
<meta charset="utf-8">
<title>アイコン3案プレビュー</title>
<style>
  body{margin:0;padding:40px;background:#101014;color:#eee;font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
  h1{font-size:20px;margin:0 0 8px} p.note{color:#999;font-size:13px;margin:0 0 32px}
  .row{display:flex;gap:40px;flex-wrap:wrap;margin-bottom:44px;align-items:flex-end}
  .card{text-align:center}
  .card b{display:block;font-size:13px;margin-bottom:10px;color:#ccc;font-weight:600}
  img{border-radius:50%;display:block;background:#000}
  .s150{width:150px;height:150px} .s88{width:88px;height:88px} .s40{width:40px;height:40px} .s28{width:28px;height:28px}
  .sizes{display:flex;gap:16px;align-items:center;margin-top:14px;justify-content:center}
  .cap{font-size:11px;color:#777;margin-top:6px}
</style>
<h1>FANZA同人アフィリ用 アイコン3案</h1>
<p class="note">Instagramのアイコンは円形に切り抜かれる。プロフィール150px / 投稿ヘッダ88px / フィード40px / コメント28px の見え方を並べた。<br>判断基準は「28pxで何のアカウントか分かるか」。</p>

<div class="row">
  <div class="card">
    <b>A案 ヨルノホンヤ（夜＋積み本）</b>
    <img class="s150" src="icon-a-yorunohonya.png">
    <div class="sizes">
      <img class="s88" src="icon-a-yorunohonya.png">
      <img class="s40" src="icon-a-yorunohonya.png">
      <img class="s28" src="icon-a-yorunohonya.png">
    </div>
    <div class="cap">参考アカウントに一番近い。無難で長持ちする</div>
  </div>

  <div class="card">
    <b>B案 ロゴ（「同」字）</b>
    <img class="s150" src="icon-b-logo.png">
    <div class="sizes">
      <img class="s88" src="icon-b-logo.png">
      <img class="s40" src="icon-b-logo.png">
      <img class="s28" src="icon-b-logo.png">
    </div>
    <div class="cap">小サイズでの識別性が最強。ジャンルは伝わりにくい</div>
  </div>

  <div class="card">
    <b>C案 ネコ司書</b>
    <img class="s150" src="icon-c-neko.png">
    <div class="sizes">
      <img class="s88" src="icon-c-neko.png">
      <img class="s40" src="icon-c-neko.png">
      <img class="s28" src="icon-c-neko.png">
    </div>
    <div class="cap">親しみ重視。リール右下のマスコットにも流用できる</div>
  </div>
</div>
