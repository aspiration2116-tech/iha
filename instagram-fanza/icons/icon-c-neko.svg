<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgC" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#2E3F7A"/>
      <stop offset="70%" stop-color="#1A2350"/>
      <stop offset="100%" stop-color="#111737"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bgC)"/>

  <!-- moon -->
  <circle cx="826" cy="266" r="96" fill="#F6C963" opacity=".95"/>
  <g fill="#FFF3D0">
    <circle cx="236" cy="240" r="7" opacity=".8"/>
    <circle cx="318" cy="352" r="4.5" opacity=".55"/>
    <circle cx="180" cy="410" r="5" opacity=".6"/>
    <circle cx="660" cy="150" r="5" opacity=".5"/>
  </g>

  <!-- cat -->
  <g stroke="#111737" stroke-width="14" stroke-linejoin="round">
    <!-- tail -->
    <path d="M700 700 c92 -6 104 -104 46 -128 c-40 -16 -72 16 -52 44"
          fill="none" stroke-linecap="round"/>
    <!-- body -->
    <path d="M540 348 c-118 0 -186 108 -186 214 c0 88 46 140 186 140
             c140 0 186 -52 186 -140 c0 -106 -68 -214 -186 -214 z" fill="#F3E9D2"/>
    <!-- ears -->
    <path d="M418 386 l-14 -114 l106 52 z" fill="#F3E9D2"/>
    <path d="M662 386 l14 -114 l-106 52 z" fill="#F3E9D2"/>
  </g>
  <!-- face -->
  <g fill="#111737">
    <path d="M470 470 q22 -26 44 0" fill="none" stroke="#111737" stroke-width="16" stroke-linecap="round"/>
    <path d="M566 470 q22 -26 44 0" fill="none" stroke="#111737" stroke-width="16" stroke-linecap="round"/>
    <circle cx="540" cy="522" r="12"/>
    <path d="M540 534 q-26 30 -50 6" fill="none" stroke="#111737" stroke-width="12" stroke-linecap="round"/>
    <path d="M540 534 q26 30 50 6" fill="none" stroke="#111737" stroke-width="12" stroke-linecap="round"/>
  </g>
  <!-- blush -->
  <g fill="#E97C7C" opacity=".55">
    <ellipse cx="446" cy="530" rx="30" ry="18"/>
    <ellipse cx="634" cy="530" rx="30" ry="18"/>
  </g>

  <!-- book under cat -->
  <g stroke="#111737" stroke-width="14" stroke-linejoin="round">
    <rect x="288" y="738" width="504" height="98" rx="16" fill="#F6C963"/>
    <rect x="332" y="836" width="416" height="52" rx="14" fill="#E97C7C"/>
  </g>
</svg>
