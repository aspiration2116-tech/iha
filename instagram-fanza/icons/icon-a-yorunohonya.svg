<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bgA" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#243066"/>
      <stop offset="60%" stop-color="#141B44"/>
      <stop offset="100%" stop-color="#0B0F2A"/>
    </radialGradient>
    <mask id="moonA">
      <rect width="1080" height="1080" fill="black"/>
      <circle cx="540" cy="330" r="132" fill="white"/>
      <circle cx="596" cy="300" r="118" fill="black"/>
    </mask>
  </defs>

  <rect width="1080" height="1080" fill="url(#bgA)"/>

  <!-- stars -->
  <g fill="#FFF3D0">
    <circle cx="230" cy="250" r="7" opacity=".85"/>
    <circle cx="330" cy="170" r="4.5" opacity=".6"/>
    <circle cx="828" cy="235" r="6" opacity=".8"/>
    <circle cx="880" cy="380" r="4" opacity=".55"/>
    <circle cx="196" cy="430" r="4.5" opacity=".5"/>
    <circle cx="742" cy="140" r="4" opacity=".5"/>
  </g>

  <!-- crescent moon -->
  <rect width="1080" height="1080" fill="#F6C963" mask="url(#moonA)"/>

  <!-- stacked books -->
  <g>
    <!-- bottom book -->
    <rect x="248" y="742" width="584" height="104" rx="18" fill="#F3E9D2"/>
    <rect x="248" y="742" width="584" height="104" rx="18" fill="none" stroke="#0B0F2A" stroke-width="14"/>
    <rect x="300" y="742" width="16" height="104" fill="#0B0F2A" opacity=".22"/>
    <rect x="764" y="742" width="16" height="104" fill="#0B0F2A" opacity=".22"/>

    <!-- middle book -->
    <rect x="292" y="622" width="496" height="104" rx="18" fill="#F6C963"/>
    <rect x="292" y="622" width="496" height="104" rx="18" fill="none" stroke="#0B0F2A" stroke-width="14"/>
    <rect x="344" y="622" width="16" height="104" fill="#0B0F2A" opacity=".25"/>
    <rect x="720" y="622" width="16" height="104" fill="#0B0F2A" opacity=".25"/>

    <!-- top book -->
    <rect x="336" y="502" width="408" height="104" rx="18" fill="#E97C7C"/>
    <rect x="336" y="502" width="408" height="104" rx="18" fill="none" stroke="#0B0F2A" stroke-width="14"/>
    <rect x="388" y="502" width="16" height="104" fill="#0B0F2A" opacity=".25"/>
    <rect x="676" y="502" width="16" height="104" fill="#0B0F2A" opacity=".25"/>

    <!-- bookmark ribbon on top book -->
    <path d="M600 502 h64 v150 l-32 -34 l-32 34 z" fill="#F3E9D2" stroke="#0B0F2A" stroke-width="12" stroke-linejoin="round"/>
  </g>
</svg>
